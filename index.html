<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yihong Hang's academic homepage: biography and publications.">
  <meta name="theme-color" content="#ffffff">
  <title>Yihong Hang</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/publications.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="profile" aria-labelledby="profile-name">
      <figure class="portrait">
        <img src="assets/profile.png" alt="Yihong Hang's GitHub avatar" width="160" height="160">
        <figcaption>GitHub avatar</figcaption>
      </figure>
      <div class="introduction">
        <h1 id="profile-name">Yihong Hang</h1>
        <p class="page-label">Academic Homepage</p>
        <p>Welcome to my academic homepage. My biography and research interests will be added here.</p>
        <nav aria-label="Profile links">
          <a href="https://github.com/anklesupport">GitHub</a>
          <a href="#publications">Publications</a>
        </nav>
      </div>
    </section>
    <section class="publications" id="publications" aria-labelledby="publications-title">
      <h2 id="publications-title">Publications</h2>
      <p class="empty-state" id="publication-status" role="status">Publications will be added soon.</p>
      <ol id="publication-list" class="publication-list" hidden></ol>
    </section>
    <footer>Yihong Hang</footer>
  </main>
</body>
</html>
